[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["android", "tools/queue-cleanup", "bridge/*_install.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
