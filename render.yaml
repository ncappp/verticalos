services:
  - type: web
    name: verticalos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        value: "8784706094"
      - key: MINI_APP_URL
        sync: false
      - key: ALLOW_DEV_AUTH
        value: "0"
      # Supabase → Project Settings → Database → Connection string → "Session pooler" (IPv4)
      - key: DATABASE_URL
        sync: false
      # sentry.io → Project → Client Keys (DSN); optional
      - key: SENTRY_DSN
        sync: false
      - key: FAXCLIP_ADMIN_IDS
        value: "8784706094"
      - key: FAXCLIP_WORKER
        value: embedded
      - key: FAXCLIP_ANTIBAN
        value: "1"
      - key: FAXCLIP_PRODUCTION
        value: "1"
