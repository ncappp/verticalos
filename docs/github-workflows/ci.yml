name: CI

on:
  push:
    branches: [main, quicon-v1]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npx --yes prettier@3.9.9 --check "*.js" app.css index.html

  tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: cd tests && python -m unittest -v

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faxtest
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/faxtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: cd tests && python -m unittest -v

  e2e:
    runs-on: ubuntu-latest
    needs: [tests-sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm install && npx playwright install --with-deps chromium
      - name: Start FaxClip (dev auth, throwaway data)
        run: |
          mkdir -p /tmp/e2edata
          PORT=8010 VERTICALOS_DATA_DIR=/tmp/e2edata ALLOW_DEV_AUTH=1 FAXCLIP_TG_BACKUP=0 \
          TELEGRAM_ALLOWED_USER_IDS=8784706094 nohup python app.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8010/api/health && break; sleep 1; done
      - name: Post → publication → status
        working-directory: tests/e2e
        run: E2E_BASE=http://localhost:8010 node publish_flow.mjs
      - if: failure()
        run: tail -100 /tmp/server.log
